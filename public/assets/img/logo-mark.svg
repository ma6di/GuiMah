<?xml version="1.0" encoding="UTF-8"?>
<!--
  GuiMah Studio — brand mark.
  A serif G + M sit inside a rounded ink square. The M's left stem shares
  space with the G's opening — a ligature-style monogram rather than two
  separate letters. Font stack matches the site (Instrument Serif) with
  a system-serif fallback so it renders correctly in email clients too.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     role="img"
     aria-label="GuiMah Studio">
  <title>GuiMah Studio</title>
  <rect width="100" height="100" rx="18" fill="#14140f"/>
  <text x="50" y="72"
        text-anchor="middle"
        font-family="Instrument Serif, Iowan Old Style, Georgia, serif"
        font-size="62"
        letter-spacing="-4"
        fill="#f6f5f1">GM</text>
</svg>
